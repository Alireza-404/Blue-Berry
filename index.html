<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="./src/assets/images/title-icon.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blueberry</title>
  </head>
  <body>
    <div
      id="root"
      class="bg-white dark:bg-body font-medium overflow-x-hidden light-select dark:dark-select"
    ></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const theme = localStorage.getItem("theme");

        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </body>
</html>
